{% extends "base.html" %}
{% block title %}Add a book{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add a book</h1>
    <p class="page-sub">Add a new title to the catalogue.</p>
</div>

<div class="panel panel-form">
    <form method="POST" class="stacked-form" enctype="multipart/form-data">
        <label for="book_code">Book ID</label>
        <input type="text" id="book_code" name="book_code" placeholder="e.g. BK005" required autofocus
               value="{{ form.book_code if form }}">

        <label for="title">Title</label>
        <input type="text" id="title" name="title" required value="{{ form.title if form }}">

        <label for="author">Author</label>
        <input type="text" id="author" name="author" required value="{{ form.author if form }}">

        <div class="form-row">
            <div>
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="e.g. Fiction, Technology"
                       value="{{ form.category if form }}">
            </div>
            <div>
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" placeholder="Optional" value="{{ form.isbn if form }}">
            </div>
        </div>

        <label for="copies">Number of copies</label>
        <input type="number" id="copies" name="copies" min="1" value="{{ form.copies if form else 1 }}" required>

        <label for="pdf_file">Book PDF (optional)</label>
        <input type="file" id="pdf_file" name="pdf_file" accept="application/pdf">
        <p class="field-hint">Upload a PDF so readers can open and read this book online. Max 25 MB.</p>

        <div class="form-actions">
            <a href="{{ url_for('books') }}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary">Add book</button>
        </div>
    </form>
</div>
{% endblock %}
